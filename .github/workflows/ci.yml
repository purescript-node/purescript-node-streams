name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build source
        run: npm run build

      - name: Run tests
        run: |
          set -x
          npm test
          npx --no-install spago test -p node-streams --main Test.Main1
          npx --no-install spago test -p node-streams --main Test.Main2
          npx --no-install spago test -p node-streams --main Test.Main3 -- <(head --bytes 1000000 /dev/zero)
          npx --no-install spago test -p node-streams --main Test.Main4

      - name: Run gzip example
        run: |
          node --input-type=module -e 'import { main } from "./output/Gzip/index.js"; main()' > "$RUNNER_TEMP/example.gz"
          gzip -dc "$RUNNER_TEMP/example.gz" | cmp - example/Gzip.txt

      - name: Lint JavaScript
        run: npm run lint

      - name: Check formatting
        run: npm run format:check
